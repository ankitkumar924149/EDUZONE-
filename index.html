
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDUZONE</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #172554;
}
header {
  background: #123b78;
  color: white;
  padding: 25px;
  text-align: center;
}
h1 { margin: 0; }
.container { padding: 20px; }
.card {
  background: white;
  padding: 22px;
  margin: 15px 0;
  border-radius: 14px;
  box-shadow: 0 2px 8px #ddd;
}
button {
  background: #1769d2;
  color: white;
  border: 0;
  padding: 12px 20px;
  border-radius: 8px;
  cursor: pointer;
}
</style>
</head>
<body>
<header>
  <h1>EDUZONE</h1>
  <p>Your Smart Learning Platform</p>
</header>
<div class="container">
  <h2>Welcome Students!</h2>
  <div class="card">
    <h3>📚 Online Classes</h3>
    <p>Learn with video classes.</p>
    <button onclick="alert('Classes Coming Soon')">Open Classes</button>
  </div>
  <div class="card">
    <h3>📝 Online Test</h3>
    <p>Practice and check your knowledge.</p>
    <button onclick="alert('Tests Coming Soon')">Start Test</button>
  </div>
  <div class="card">
    <h3>📄 PDF Notes</h3>
    <p>Study your notes online.</p>
    <button onclick="alert('PDF Coming Soon')">Open Notes</button>
  </div>
  <div class="card">
    <h3>💳 Online Payment</h3>
    <p>Purchase your courses.</p>
    <button onclick="alert('Payment Coming Soon')">Buy Course</button>
  </div>
</div>
</body>
</html>
